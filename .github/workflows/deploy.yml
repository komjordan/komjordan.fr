name: Déploiement komjordan.fr sur LWS

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    name: Déploiement FTP
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Déployer vers LWS via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Adapter si le site n'est pas servi depuis la racine du compte FTP,
          # par exemple "server-root: /www/" selon la config LWS
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/README.md
